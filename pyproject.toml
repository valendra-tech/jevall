[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jev-gate"
version = "0.1.0"
description = "A small, unofficial Jev-compatible typed-decision gateway"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Valendra Tech" }]
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
]

[project.scripts]
jev-gate = "jev_gate.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["jev_gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
